name: Kaluna CI/CD

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  TF_VERSION: '1.5.7'
  GO_VERSION: '1.21'
  PYTHON_VERSION: '3.11'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      
      - name: Install Python dependencies
        run: |
          pip install pytest moto boto3
      
      - name: Run Events tests
        run: |
          cd services/events
          python -m pytest tests/ -v
      
      - name: Run Registrations tests
        run: |
          cd services/registrations
          python -m pytest tests/ -v
      
      - name: Run Check-in tests
        run: |
          cd services/checkin
          go test -v ./...

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi
          
      - name: Build Check-in binary
        run: |
          cd services/checkin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bootstrap main.go
          
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform Init
        run: terraform init
        working-directory: terraform/environments/${{ steps.env.outputs.environment }}
      
            - name: Terraform Plan
        env:
          TF_VAR_resend_api_key: ${{ secrets.RESEND_API_KEY }}
        run: terraform plan -no-color -out=tfplan
        working-directory: terraform/environments/${{ steps.env.outputs.environment }}
      
            - name: Terraform Apply
        env:
          TF_VAR_resend_api_key: ${{ secrets.RESEND_API_KEY }}
        run: terraform apply -auto-approve tfplan
        working-directory: terraform/environments/${{ steps.env.outputs.environment }}
      
      - name: Get API URL
        id: api
        run: |
          API_URL=$(terraform output -raw api_url)
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
        working-directory: terraform/environments/${{ steps.env.outputs.environment }}
      
      - name: Smoke Test
        run: |
          echo "Running smoke test against ${{ steps.api.outputs.api_url }}/api/v1/health"
          for i in {1..6}; do
            RESPONSE=$(curl -s -o /dev/null -w '%{http_code}' "${{ steps.api.outputs.api_url }}/api/v1/health")
            if [ "$RESPONSE" == "200" ]; then
              echo "Smoke test PASSED"
              exit 0
            fi
            echo "Attempt $i failed ($RESPONSE). Retrying in 5 seconds..."
            sleep 5
          done
          echo "Smoke test FAILED — /api/v1/health never returned 200"
          exit 1

      - name: Setup Node.js
        if: steps.env.outputs.environment == 'prod'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Deploy Frontend to S3
        if: steps.env.outputs.environment == 'prod'
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ secrets.NEXT_PUBLIC_COGNITO_USER_POOL_ID }}
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_COGNITO_CLIENT_ID }}
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..
          BUCKET=$(cd terraform/environments/prod && terraform output -raw frontend_bucket_name)
          aws s3 sync frontend/out/ "s3://${BUCKET}" --delete

      - name: Invalidate CloudFront Cache
        if: steps.env.outputs.environment == 'prod'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
